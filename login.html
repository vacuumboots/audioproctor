<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AudioProctor — Sign In</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <a href="/" class="wordmark">Audio<span class="accent">Proctor</span></a>
      <p class="tagline">Assessment audio for managed Chromebooks</p>

      <div id="notice" class="notice notice--error hidden"></div>

      <button id="btn-signin" class="btn btn--primary" onclick="signInWithGoogle()">
        Sign in with Google
      </button>

      <p class="login-footer">For teachers only. Students use the Chrome extension.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // Redirect to the correct page if already signed in
    (async () => {
      const session = await getSession();
      if (!session) return;
      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('role')
        .eq('id', session.user.id)
        .maybeSingle();
      const dest = {
        platform_admin: '/admin.html',
        division_admin: '/division-admin.html',
        school_admin:   '/school-admin.html',
      }[profile?.role] || '/dashboard.html';
      window.location.href = dest;
    })();

    // Catch the OAuth / magic-link callback and route by role
    supabaseClient.auth.onAuthStateChange(async (event, session) => {
      if (event === 'SIGNED_IN' && session) {
        const { data: profile } = await supabaseClient
          .from('profiles')
          .select('role')
          .eq('id', session.user.id)
          .maybeSingle();
        const dest = {
          platform_admin:  '/admin.html',
          division_admin:  '/division-admin.html',
          school_admin:    '/school-admin.html',
        }[profile?.role] || '/dashboard.html';
        window.location.href = dest;
      }
    });

    // Show error from URL param (e.g. if auth fails)
    const params = new URLSearchParams(window.location.search);
    if (params.get('error')) {
      const el = document.getElementById('notice');
      el.textContent = 'Sign-in failed. Please try again.';
      el.classList.remove('hidden');
    }
  </script>
</body>
</html>
