<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AudioProctor</title>
  <script type="module" src="/js/i18n.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <a href="/" class="wordmark">Audio<span class="accent">Proctor</span></a>
      <p id="tagline" class="tagline"></p>

      <div id="notice" class="notice notice--error hidden"></div>

      <button id="btn-signin" class="btn btn--primary" onclick="signInWithGoogle()"></button>

      <p id="login-footer-teachers" class="login-footer"></p>
      <p class="login-footer" style="margin-top:0.5rem;">
        <span id="new-here-text"></span>
        <a id="request-access-link" href="/request-access" style="color:var(--ink);"></a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    async function redirectByRole(session) {
      // If the user arrived via an invitation link, send them there to complete acceptance
      const pendingToken = localStorage.getItem('ap_pending_invite_token');
      if (pendingToken) {
        window.location.href = `/accept-invite.html?token=${encodeURIComponent(pendingToken)}`;
        return;
      }

      const { data: profile } = await supabaseClient
        .from('profiles').select('role').eq('id', session.user.id).maybeSingle();
      const dest = {
        platform_admin: '/admin.html',
        division_admin: '/division-admin.html',
        school_admin:   '/school-admin.html',
      }[profile?.role] || '/dashboard.html';
      window.location.href = dest;
    }
    // ─── i18n: populate translated text ──────────────────────────────
    function applyLoginI18n() {
      document.title = 'AudioProctor \u2014 ' + t('auth.signIn');
      var tagline = document.getElementById('tagline');
      if (tagline) tagline.textContent = t('auth.loginTagline');
      var btn = document.getElementById('btn-signin');
      if (btn) btn.textContent = t('auth.signInWithGoogle');
      var footer = document.getElementById('login-footer-teachers');
      if (footer) footer.textContent = t('auth.forTeachersOnly');
      var newHere = document.getElementById('new-here-text');
      if (newHere) newHere.textContent = t('auth.newHere') + '\u00a0';
      var requestLink = document.getElementById('request-access-link');
      if (requestLink) requestLink.textContent = t('auth.requestAccess');
    }
    window.i18nReady.then(applyLoginI18n);
    window.addEventListener('localechanged', applyLoginI18n);

    // ─── Auth state handler ─────────────────────────────────────────
    // Handles both: OAuth callback (token in hash) and returning signed-in users.
    // onAuthStateChange fires immediately if Supabase detects a token in the URL hash.
    supabaseClient.auth.onAuthStateChange(async (event, session) => {
      if (event === 'SIGNED_IN' && session) {
        // Remove the token hash from the browser history before navigating away
        history.replaceState(null, '', window.location.pathname);
        await redirectByRole(session);
      }
    });

    // Show error from URL param (e.g. if OAuth provider returns an error)
    var params = new URLSearchParams(window.location.search);
    if (params.get('error')) {
      var el = document.getElementById('notice');
      el.textContent = t('auth.couldNotStartSignIn');
      el.classList.remove('hidden');
    }
  </script>
</body>
</html>
