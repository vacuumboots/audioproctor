<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About — AudioProctor</title>
  <meta name="description" content="AudioProctor was built by an IT administrator at an Alberta school division who ran into this problem and couldn't find a solution that didn't create new privacy issues.">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/site/site.css">
  <script src="/site/js/i18n.js"></script>
</head>
<body>

<div id="site-nav"></div>

<div class="site-section" style="border-top: var(--border);">
  <div class="site-container">
    <span class="section-label" id="about-label"></span>
    <h1 class="section-headline" id="about-headline"></h1>
  </div>
</div>

<div class="site-section" style="padding-top:0; border-top:none;">
  <div class="site-container">
    <div class="prose" id="about-prose"></div>
  </div>
</div>

<div id="site-footer"></div>
<script src="/site/nav.js"></script>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
<script>window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };</script>
<script defer src="/_vercel/speed-insights/script.js"></script>

<script>
(function () {
  'use strict';

  function renderAbout() {
    // ── Meta ──
    document.title = t('about.metaTitle');
    document.querySelector('meta[name="description"]').content = t('about.metaDescription');

    // ── Hero section ──
    document.getElementById('about-label').textContent = t('about.sectionLabel');
    document.getElementById('about-headline').textContent = t('about.pageTitle');

    // ── Prose sections ──
    var prose = document.getElementById('about-prose');
    prose.innerHTML = ''

      // The Problem
      + '<h2>' + t('about.problemTitle') + '</h2>'
      + '<p>' + t('about.problemBody1') + '</p>'
      + '<p>' + t('about.problemBody2') + '</p>'
      + '<p>' + t('about.problemBody3') + '</p>'

      // The Solution
      + '<h2>' + t('about.solutionTitle') + '</h2>'
      + '<p>' + t('about.solutionBody1') + '</p>'
      + '<p>' + t('about.solutionBody2') + '</p>'

      // Pricing
      + '<h2>' + t('about.pricingTitle') + '</h2>'
      + '<p>' + t('about.pricingBody')
      + ' <a href="/#pricing" style="color:var(--ink);">' + t('about.pricingLink') + '</a></p>'

      // Built by someone in the room
      + '<h2>' + t('about.teamTitle') + '</h2>'
      + '<p>' + t('about.teamBody1') + '</p>'
      + '<p>'
      + t('about.teamBody2', { link: '<a href="/contact" style="color:var(--ink);">' + t('about.teamBody2Link') + '</a>' })
      + '</p>';
  }

  if (window.i18nReady) {
    window.i18nReady.then(renderAbout);
  }
  window.addEventListener('localechanged', renderAbout);
})();
</script>
</body>
</html>
