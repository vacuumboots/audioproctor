<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>AudioProctor Bridge</title></head>
<body>
<!--
  Minimal audio proxy used by the Chrome extension.
  The extension page cannot produce sound on Chrome OS, so this page
  (served from the web domain) plays audio and relays events back
  to the extension via postMessage.
-->
<script>
const audio = new Audio();
audio.preload = 'auto';

window.addEventListener('message', e => {
  const msg = e.data;
  if (!msg || !msg.type) return;
  switch (msg.type) {
    case 'load':
      audio.src = msg.url;
      audio.load();
      audio.volume = 1;
      audio.muted  = false;
      break;
    case 'play':
      audio.play().catch(err => {
        parent.postMessage({ type: 'error', message: err.message }, '*');
      });
      break;
    case 'pause':
      audio.pause();
      break;
    case 'seek':
      audio.currentTime = msg.time;
      break;
    case 'speed':
      audio.playbackRate = msg.rate;
      break;
    case 'rewind':
      audio.currentTime = Math.max(0, audio.currentTime - (msg.seconds || 10));
      break;
  }
});

audio.addEventListener('loadedmetadata', () => {
  parent.postMessage({ type: 'loadedmetadata', duration: audio.duration }, '*');
});

audio.addEventListener('timeupdate', () => {
  parent.postMessage({ type: 'timeupdate', currentTime: audio.currentTime }, '*');
});

audio.addEventListener('ended', () => {
  parent.postMessage({ type: 'ended' }, '*');
});

audio.addEventListener('error', () => {
  parent.postMessage({
    type: 'error',
    message: audio.error ? 'code ' + audio.error.code : 'unknown'
  }, '*');
});
</script>
</body>
</html>
