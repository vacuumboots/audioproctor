<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AudioProctor — Dashboard</title>
  <script type="module" src="/js/i18n.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .tier-badge {
      display: inline-block;
      padding: 0.18rem 0.55rem;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 500;
      border: 1px solid var(--ink);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
    }
    .tier-badge--paid {
      background: var(--ink);
      color: var(--paper);
    }
    .upload-stats {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.3rem;
      line-height: 1.4;
    }
    .stat-box {
      border: var(--border);
      padding: 1.25rem 1.5rem;
    }
    .stat-box__value {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 0.25rem;
    }
    .upload-progress {
      margin-top: 1rem;
      display: none;
    }
    .upload-progress__bar {
      width: 100%;
      height: 4px;
      background: var(--warm-mid);
      margin-bottom: 0.4rem;
    }
    .upload-progress__fill {
      height: 100%;
      background: var(--ink);
      width: 0%;
      transition: width 0.2s ease;
    }
    .upload-progress__label {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .col-assessment { min-width: 180px; }
    .col-assessment__label { font-weight: 500; }
    .col-assessment__filename { font-size: 0.78rem; color: var(--muted); margin-top: 0.1rem; }
    .type-toggle {
      display: inline-flex;
      border: var(--border);
    }
    .type-toggle__btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      padding: 0.5rem 1.5rem;
      border: none;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .type-toggle__btn + .type-toggle__btn {
      border-left: var(--border);
    }
    .type-toggle__btn--active {
      background: var(--ink);
      color: var(--paper);
    }
    .type-toggle__btn:not(.type-toggle__btn--active):hover {
      background: var(--warm-mid);
    }
    .quota-bar {
      background: var(--warm-mid);
      border: 1px solid var(--ink);
      padding: 0.75rem 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
    }
    .quota-bar--full {
      background: var(--light-accent);
      border-color: var(--accent);
      color: var(--accent);
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(26,26,46,0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-box {
      background: var(--paper);
      border: 1px solid var(--ink);
      padding: 2.5rem;
      max-width: 460px;
      width: 90%;
    }
    .modal-box h2 {
      font-size: 1.35rem;
      margin-bottom: 0.75rem;
    }
    /* ─── Autocomplete dropdown ──────────────────────────────────── */
    .autocomplete-wrap {
      position: relative;
    }
    .autocomplete-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid var(--ink);
      border-top: none;
      background: var(--paper);
      z-index: 200;
      display: none;
    }
    .autocomplete-dropdown.open {
      display: block;
    }
    .autocomplete-dropdown .ac-option {
      padding: 0.5rem 0.8rem;
      cursor: pointer;
      font-size: 0.9rem;
      border-bottom: 1px solid var(--warm-mid);
    }
    .autocomplete-dropdown .ac-option:last-child {
      border-bottom: none;
    }
    .autocomplete-dropdown .ac-option:hover,
    .autocomplete-dropdown .ac-option.highlighted {
      background: var(--ink);
      color: var(--paper);
    }
    .autocomplete-dropdown .ac-option .ac-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-left: 0.5rem;
    }
    .autocomplete-dropdown .ac-option:hover .ac-meta {
      color: var(--warm-mid);
    }
    .autocomplete-dropdown .ac-no-match {
      padding: 0.75rem 0.8rem;
      color: var(--muted);
      font-size: 0.85rem;
      font-style: italic;
    }
    .autocomplete-selected {
      border-color: var(--accent) !important;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="page-container">
      <div class="top-bar__inner">
        <span class="wordmark">Audio<span class="accent">Proctor</span></span>
        <div style="display:flex; align-items:center; gap:1.5rem;">
          <span id="tier-badge" class="tier-badge hidden"></span>
          <span id="user-email" class="label"></span>
          <a id="admin-nav-link" href="/admin.html" class="btn btn--ghost btn--small hidden"></a>
          <a id="school-admin-nav-link" href="/school-admin.html" class="btn btn--ghost btn--small hidden"></a>
          <a id="div-admin-nav-link" href="/division-admin.html" class="btn btn--ghost btn--small hidden"></a>
          <a id="nav-extension" href="https://chromewebstore.google.com/detail/audioproctor/fcphbkffopenkinliokmlopfnglbcfdj" target="_blank" rel="noopener" class="btn btn--ghost btn--small"></a>
          <a id="nav-settings" href="/settings.html" class="btn btn--ghost btn--small"></a>
          <span class="lang-toggle" id="lang-toggle"></span>
          <button id="btn-signout" class="btn btn--ghost btn--small" onclick="handleSignOut()"></button>
        </div>
      </div>
    </div>
  </div>

  <div class="page-container" style="padding-top:2.5rem; padding-bottom:4rem;">

    <div id="trial-banner" class="hidden" style="margin-bottom:1.5rem; padding:0.75rem 1rem; border:1px solid var(--ink); background:var(--light-accent); font-size:0.9rem; display:flex; align-items:center; justify-content:space-between;">
      <span id="trial-banner-text"></span>
      <button id="trial-banner-btn" class="btn btn--small" style="border:1px solid var(--ink); background:var(--paper); color:var(--ink); font-family:inherit; font-size:0.75rem; letter-spacing:0.08em; text-transform:uppercase; cursor:pointer;"></button>
    </div>

    <div id="quota-indicator" class="quota-bar hidden"></div>
    <div id="upgrade-cta" class="hidden" style="font-size:0.85rem; color:var(--muted); margin-bottom:1.5rem; padding:0.75rem 1rem; border:1px solid var(--warm-mid);"></div>

    <!-- Upload Card -->
    <div class="card">
      <div class="card__header">
        <p id="upload-card-header" class="label"></p>
      </div>

      <div id="upload-notice" class="notice hidden"></div>

      <div class="form-group">
        <label id="assessment-type-label" class="label"></label>
        <div class="type-toggle" id="assessment-type-toggle">
          <button id="btn-toggle-audio" type="button" class="type-toggle__btn type-toggle__btn--active" data-type="audio" onclick="selectAssessmentType('audio')"></button>
          <button id="btn-toggle-text" type="button" class="type-toggle__btn" data-type="text" onclick="selectAssessmentType('text')"></button>
        </div>
        <input type="hidden" id="assessment-type" value="audio">
      </div>

      <div class="form-group">
        <label class="label" for="label-input" id="assessment-label-label"><span id="assessment-label-text"></span> <span id="label-optional-hint" style="font-weight:300; text-transform:none; letter-spacing:0;"></span></label>
        <input
          type="text"
          id="label-input"
          class="input-field"
          placeholder=""
          maxlength="120"
        >
      </div>

      <div id="audio-input-group" class="form-group">
        <label id="audio-file-label" class="label" for="file-input"></label>
        <input
          type="file"
          id="file-input"
          class="input-field"
          accept=".mp3,audio/mpeg,.wav,audio/wav,audio/x-wav"
          onchange="handleFileSelect(this)"
        >
        <span id="file-hint" class="label text-muted"></span>
      </div>

      <div id="text-input-group" class="form-group hidden">
        <label id="assessment-text-label" class="label"></label>
        <p id="text-mode-hint" style="font-size:0.85rem; color:var(--muted); line-height:1.5; margin-bottom:0.6rem;"></p>
        <div
          id="text-content-editor"
          class="text-editor"
          contenteditable="true"
          placeholder=""
        ></div>
        <span id="text-hint" class="label text-muted"></span>
      </div>

      <!-- Advanced Options — premium only, hidden for free tier -->
      <div id="advanced-options" class="hidden" style="margin-top:1.25rem; border-top: 1px solid var(--warm-mid); padding-top:1.25rem;">
        <p id="advanced-options-label" class="label" style="margin-bottom:1rem;"></p>

        <div class="form-group">
          <label id="exit-word-label-section" class="label" for="exit-word-mode"></label>
          <select id="exit-word-mode" class="input-field" onchange="toggleCustomExitWord()">
            <option id="opt-ew-random-short" value="random-short"></option>
            <option id="opt-ew-random-long" value="random-long"></option>
            <option id="opt-ew-random-phrase" value="random-phrase"></option>
            <option id="opt-ew-random-pin" value="random-pin"></option>
            <option id="opt-ew-custom" value="custom"></option>
          </select>
        </div>
        <div id="custom-exit-word-group" class="form-group hidden">
          <label id="custom-exit-word-label" class="label" for="custom-exit-word"></label>
          <input type="text" id="custom-exit-word" class="input-field" placeholder="" maxlength="60">
        </div>

        <div class="form-group">
          <label id="code-format-label" class="label" for="code-format"></label>
          <select id="code-format" class="input-field" onchange="toggleCustomCode()">
            <option id="opt-cf-standard" value="standard"></option>
            <option id="opt-cf-custom" value="custom"></option>
          </select>
        </div>
        <div id="custom-code-group" class="form-group hidden">
          <label id="custom-code-label" class="label" for="custom-code"></label>
          <input type="text" id="custom-code" class="input-field input-field--code" placeholder="" maxlength="20">
          <span id="custom-code-hint" class="label text-muted" style="text-transform:none; letter-spacing:0; font-size:0.8rem;"></span>
        </div>
      </div>

      <div class="upload-progress" id="upload-progress" style="margin-top:1rem;">
        <div class="upload-progress__bar">
          <div class="upload-progress__fill" id="progress-fill"></div>
        </div>
        <span class="upload-progress__label" id="progress-label"></span>
      </div>

      <button
        id="btn-upload"
        class="btn btn--primary"
        onclick="handleUpload()"
        disabled
      >
      </button>
    </div>

    <!-- Uploads List -->
    <div class="card mt-4">
      <div class="card__header">
        <p id="your-uploads-label" class="label"></p>
      </div>

      <div id="uploads-container">
        <div class="empty-state">
          <p id="empty-state-text" class="label"></p>
        </div>
      </div>
    </div>

    <!-- Insights (paid tiers only) -->
    <div id="insights-card" class="card mt-4 hidden">
      <div class="card__header" style="display:flex; align-items:center; justify-content:space-between;">
        <p id="insights-title" class="label"></p>
        <div style="display:flex; align-items:center; gap:1rem;">
          <span id="insights-refresh-note" class="label text-muted" style="text-transform:none; letter-spacing:0; font-size:0.72rem;"></span>
          <button id="btn-export-csv" class="btn btn--ghost btn--small" onclick="exportCsv()"></button>
        </div>
      </div>
      <div id="insights-container">
        <div class="empty-state"><p id="insights-loading-label" class="label"></p></div>
      </div>
    </div>

  </div>

  <!-- Edit Label modal -->
  <div id="edit-label-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <p id="rename-assessment-title" class="label" style="margin-bottom:0.75rem;"></p>
      <div class="form-group">
        <label class="label" for="edit-label-input" id="edit-label-modal-label"></label>
        <input type="text" id="edit-label-input" class="input-field" maxlength="120">
      </div>
      <div style="display:flex; gap:0.75rem; margin-top:0.5rem;">
        <button id="btn-rename-save" class="btn btn--primary" onclick="saveEditLabel()"></button>
        <button id="btn-rename-cancel" class="btn btn--ghost" onclick="document.getElementById('edit-label-modal').classList.add('hidden')"></button>
      </div>
    </div>
  </div>

  <!-- Edit Expiry modal -->
  <div id="edit-expiry-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <p id="edit-expiry-title" class="label" style="margin-bottom:0.75rem;"></p>
      <div class="form-group">
        <label class="label" for="expiry-date-input" id="expiry-date-label"></label>
        <input type="datetime-local" id="expiry-date-input" class="input-field">
      </div>
      <div style="display:flex; gap:0.75rem; margin-top:0.5rem; flex-wrap:wrap;">
        <button id="btn-save-date" class="btn btn--primary" onclick="saveExpiryDate()"></button>
        <button id="btn-extend-7" class="btn btn--ghost" onclick="extendSevenDays()"></button>
        <button id="btn-cancel-expiry" class="btn btn--ghost" onclick="document.getElementById('edit-expiry-modal').classList.add('hidden')"></button>
      </div>
    </div>
  </div>

  <!-- First-login modal: shown once until teacher enters their division name -->
  <div id="first-login-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <p id="first-login-title" class="label" style="margin-bottom:0.75rem;"></p>
      <h2 id="first-login-question"></h2>
      <p id="first-login-description" style="font-size:0.9rem; color:var(--muted); line-height:1.6; margin-bottom:1.5rem;"></p>
      <!-- Honeypot — hidden from real users, filled by bots -->
      <input type="text" id="division-honeypot" style="display:none;" tabindex="-1" autocomplete="off">
      <div class="form-group">
        <div class="autocomplete-wrap">
          <input type="hidden" id="division-id-input" value="">
          <input type="text" id="division-name-input" class="input-field" placeholder="" maxlength="120" autocomplete="off">
          <div id="division-autocomplete-dropdown" class="autocomplete-dropdown"></div>
        </div>
        <p id="division-fallback-note" class="hidden" style="font-size:0.8rem; color:var(--muted); font-style:italic; margin-top:0.25rem;"></p>
      </div>
      <div style="display:flex; align-items:flex-start; gap:0.75rem; margin-bottom:1.25rem;">
        <input type="checkbox" id="tos-checkbox" style="margin-top:0.2rem; flex-shrink:0;" onchange="document.getElementById('btn-continue').disabled = !this.checked;">
        <label for="tos-checkbox" id="tos-label" style="font-size:0.85rem; color:var(--muted); line-height:1.5; cursor:pointer;"></label>
      </div>
      <button id="btn-continue" class="btn btn--primary" onclick="submitDivisionSetup()" disabled></button>
    </div>
  </div>

  <!-- Request Premium / School / Division Modal -->
  <div id="request-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <p id="request-modal-header" class="label" style="margin-bottom:0.75rem;"></p>
      <h2 id="request-modal-title"></h2>
      <p id="request-modal-desc" style="font-size:0.9rem; color:var(--muted); line-height:1.6; margin-bottom:1.5rem;"></p>
      <div class="form-group">
        <label class="label" for="request-type-select" id="request-type-label"></label>
        <select id="request-type-select" class="input-field" onchange="updateRequestModalTitle()">
          <option id="opt-rt-premium" value="premium_trial"></option>
          <option id="opt-rt-school" value="school_plan"></option>
          <option id="opt-rt-division" value="division_plan"></option>
        </select>
      </div>
      <div class="form-group">
        <label class="label" for="request-message" id="request-message-label"><span id="request-message-text"></span> <span id="request-message-optional" style="font-weight:300; text-transform:none; letter-spacing:0;"></span></label>
        <textarea id="request-message" class="input-field" rows="3" placeholder="" maxlength="500"></textarea>
      </div>
      <div style="display:flex; gap:0.75rem; margin-top:0.5rem;">
        <button id="btn-request-submit" class="btn btn--primary" onclick="submitRequest()"></button>
        <button id="btn-request-cancel" class="btn btn--ghost" onclick="document.getElementById('request-modal').classList.add('hidden')"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/language-toggle.js"></script>
  <!-- dashboard module splits -->
  <script src="/js/dashboard-state.js"></script>
  <script src="/js/dashboard-utils.js"></script>
  <script src="/js/dashboard-access-codes.js"></script>
  <script src="/js/dashboard-audio.js"></script>
  <script src="/js/dashboard-editor.js"></script>
  <script src="/js/dashboard-upload.js"></script>
  <script src="/js/dashboard-table.js"></script>
  <script src="/js/dashboard-quota.js"></script>
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script>window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };</script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
  <script>
    // ─── i18n: populate translated text ──────────────────────────────
    function applyDashboardI18n() {
      document.title = 'AudioProctor \u2014 ' + t('dashboard.uploadAssessment');
      // Top bar nav
      var el = document.getElementById('admin-nav-link');
      if (el) el.textContent = t('nav.admin');
      el = document.getElementById('school-admin-nav-link');
      if (el) el.textContent = t('nav.schoolAdmin');
      el = document.getElementById('div-admin-nav-link');
      if (el) el.textContent = t('nav.divisionAdmin');
      el = document.getElementById('nav-extension');
      if (el) el.textContent = t('nav.extension');
      el = document.getElementById('nav-settings');
      if (el) el.textContent = t('nav.settings');
      el = document.getElementById('btn-signout');
      if (el) el.textContent = t('auth.signOut');

      // Upload card
      document.getElementById('upload-card-header').textContent = t('dashboard.uploadAssessment');
      document.getElementById('assessment-type-label').textContent = t('dashboard.assessmentType');
      document.getElementById('btn-toggle-audio').textContent = t('dashboard.typeAudio');
      document.getElementById('btn-toggle-text').textContent = t('dashboard.typeText');
      document.getElementById('assessment-label-text').textContent = t('dashboard.label');
      document.getElementById('label-optional-hint').textContent = t('dashboard.labelHint');
      document.getElementById('label-input').placeholder = t('dashboard.labelPlaceholder');
      document.getElementById('audio-file-label').textContent = t('dashboard.audioLabel');
      document.getElementById('file-hint').textContent = t('dashboard.audioHint', { bitrate: '32kbps' });
      document.getElementById('assessment-text-label').textContent = t('dashboard.textLabel');
      document.getElementById('text-mode-hint').textContent = t('dashboard.textModeHint');
      document.getElementById('text-content-editor').setAttribute('placeholder', t('dashboard.textPlaceholder'));
      document.getElementById('text-hint').textContent = t('dashboard.textHint');
      document.getElementById('advanced-options-label').textContent = t('dashboard.advancedOptions.title');
      document.getElementById('exit-word-label-section').textContent = t('dashboard.exitWordModeLabel');
      document.getElementById('opt-ew-random-short').textContent = t('dashboard.exitWordRandomShort');
      document.getElementById('opt-ew-random-long').textContent = t('dashboard.exitWordRandomLong');
      document.getElementById('opt-ew-random-phrase').textContent = t('dashboard.exitWordRandomPhrase');
      document.getElementById('opt-ew-random-pin').textContent = t('dashboard.exitWordRandomPin');
      document.getElementById('opt-ew-custom').textContent = t('dashboard.exitWordCustom');
      document.getElementById('custom-exit-word-label').textContent = t('dashboard.customExitWordLabel');
      document.getElementById('custom-exit-word').placeholder = t('dashboard.exitWordPlaceholder');
      document.getElementById('code-format-label').textContent = t('dashboard.codeFormatLabel');
      document.getElementById('opt-cf-standard').textContent = t('dashboard.codeFormatStandard');
      document.getElementById('opt-cf-custom').textContent = t('dashboard.codeFormatCustom');
      document.getElementById('custom-code-label').textContent = t('dashboard.customCodeLabel');
      document.getElementById('custom-code').placeholder = t('dashboard.accessCodePlaceholder');
      document.getElementById('custom-code-hint').textContent = t('dashboard.customCodeHint');
      document.getElementById('progress-label').textContent = t('dashboard.uploading');
      document.getElementById('btn-upload').textContent = t('dashboard.uploadButton');

      // Uploads list
      document.getElementById('your-uploads-label').textContent = t('dashboard.tableHeaders.assessment');
      document.getElementById('empty-state-text').textContent = t('dashboard.noUploads');

      // Insights
      document.getElementById('insights-title').textContent = t('dashboard.insightsTitle');
      document.getElementById('insights-refresh-note').textContent = t('dashboard.insightsRefresh');
      document.getElementById('btn-export-csv').textContent = t('dashboard.exportCSV');
      document.getElementById('insights-loading-label').textContent = t('common.loading');

      // Edit label modal
      document.getElementById('rename-assessment-title').textContent = t('dashboard.renameAssessment');
      document.getElementById('edit-label-modal-label').textContent = t('dashboard.renameLabel');
      document.getElementById('btn-rename-save').textContent = t('common.save');
      document.getElementById('btn-rename-cancel').textContent = t('common.cancel');

      // Edit expiry modal
      document.getElementById('edit-expiry-title').textContent = t('dashboard.extendExpiry');
      document.getElementById('expiry-date-label').textContent = t('dashboard.extendLabel');
      document.getElementById('btn-save-date').textContent = t('common.save') + ' ' + t('dashboard.expiry');
      document.getElementById('btn-extend-7').textContent = t('dashboard.extendDays7');
      document.getElementById('btn-cancel-expiry').textContent = t('common.cancel');

      // First-login modal
      document.getElementById('first-login-title').textContent = t('dashboard.firstLogin.title');
      document.getElementById('first-login-question').textContent = t('dashboard.firstLogin.question');
      document.getElementById('first-login-description').textContent = t('dashboard.firstLogin.description');
      document.getElementById('division-name-input').placeholder = t('dashboard.firstLogin.placeholder');
      document.getElementById('division-fallback-note').textContent = t('dashboard.firstLogin.fallbackNote');
      // TOS label: built with innerHTML because it contains links
      var tosLabel = document.getElementById('tos-label');
      if (tosLabel) {
        tosLabel.innerHTML = t('dashboard.firstLogin.tosAgreement', {
          tosLink: '<a href="/site/terms.html" target="_blank" style="color:var(--ink);">' + t('common.termsOfService') + '</a>',
          privacyLink: '<a href="/site/privacy.html" target="_blank" style="color:var(--ink);">' + t('common.privacyPolicy') + '</a>'
        });
      }
      document.getElementById('btn-continue').textContent = t('dashboard.firstLogin.continue');

      // Request modal
      document.getElementById('request-modal-header').textContent = t('dashboard.requestAccess.title');
      document.getElementById('request-modal-desc').textContent = t('dashboard.requestAccess.description');
      document.getElementById('request-type-label').textContent = t('dashboard.requestAccess.typeLabel');
      document.getElementById('opt-rt-premium').textContent = t('dashboard.requestAccess.premiumTrial');
      document.getElementById('opt-rt-school').textContent = t('dashboard.requestAccess.schoolPlan');
      document.getElementById('opt-rt-division').textContent = t('dashboard.requestAccess.divisionPlan');
      document.getElementById('request-message-text').textContent = t('dashboard.requestAccess.messageLabel');
      document.getElementById('request-message-optional').textContent = t('dashboard.requestAccess.messageOptional');
      document.getElementById('request-message').placeholder = t('dashboard.requestAccess.placeholder');
      document.getElementById('btn-request-submit').textContent = t('dashboard.requestAccess.submit');
      document.getElementById('btn-request-cancel').textContent = t('common.cancel');

      // Refresh title (may have been set by dynamic updateRequestModalTitle)
      if (window.updateRequestModalTitle) updateRequestModalTitle();
    }
    window.i18nReady.then(applyDashboardI18n);
    window.addEventListener('localechanged', applyDashboardI18n);

    (async () => {
      const user = await requireAuth();
      document.getElementById('user-email').textContent = user.email;
      await Promise.all([loadUploads(), loadQuota()]);
      await checkFirstLogin();
    })();
  </script>

</body>
</html>
