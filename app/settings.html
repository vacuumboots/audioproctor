<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AudioProctor — Settings</title>
  <script>
    // i18n module loads deferred — provide placeholder so regular scripts
    // can call window.i18nReady.then() before the module executes.
    window.i18nReady = new Promise(function (r) { window._i18nBridge = r; });
  </script>
  <script type="module" src="/js/i18n.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .settings-section {
      border-top: var(--border);
      padding-top: 2rem;
      margin-top: 2rem;
    }
    .settings-section:first-child {
      border-top: none;
      padding-top: 0;
      margin-top: 0;
    }
    .danger-zone {
      border-top: 2px solid var(--accent);
      padding-top: 2rem;
      margin-top: 2rem;
    }
    .danger-zone .label { color: var(--accent); }
    .subscription-block {
      border: var(--border);
      padding: 1.25rem 1.5rem;
      background: var(--warm-mid);
      font-size: 0.9rem;
    }
    .subscription-block p { margin: 0; line-height: 1.6; }
    .subscription-block strong { font-weight: 500; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="page-container">
      <div class="top-bar__inner">
        <span class="wordmark">Audio<span class="accent">Proctor</span></span>
        <div style="display:flex; align-items:center; gap:1.5rem;">
          <span id="user-email" class="label"></span>
          <a id="lnk-dashboard" href="/dashboard.html" class="btn btn--ghost btn--small"></a>
          <button id="btn-signout" class="btn btn--ghost btn--small" onclick="handleSignOut()"></button>
        </div>
      </div>
    </div>
  </div>

  <div class="page-container" style="padding-top:2.5rem; padding-bottom:4rem; max-width:640px;">

    <h1 id="heading-settings" style="font-size:1.6rem; margin-bottom:2rem;"></h1>

    <div class="card">

      <!-- ─── Profile ─────────────────────────────────────────────────── -->
      <div class="settings-section">
        <p id="label-profile" class="label" style="margin-bottom:1.25rem;"></p>

        <div class="form-group">
          <label class="label" for="display-name-input">
            <span id="label-display-name"></span>
            <span id="span-display-name-optional" style="font-weight:300; text-transform:none; letter-spacing:0;"></span>
          </label>
          <input type="text" id="display-name-input" class="input-field" maxlength="80">
        </div>

        <div class="form-group">
          <label id="label-email" class="label"></label>
          <p id="profile-email" style="font-size:0.9rem; color:var(--muted); margin:0.25rem 0 0;">—</p>
          <p id="txt-email-sourced" class="label text-muted" style="margin-top:0.25rem; text-transform:none; letter-spacing:0; font-size:0.75rem;"></p>
        </div>

        <div class="form-group">
          <label id="label-org" class="label"></label>
          <p id="profile-org" style="font-size:0.9rem; color:var(--muted); margin:0.25rem 0 0;">—</p>
          <p id="txt-org-admin" class="label text-muted" style="margin-top:0.25rem; text-transform:none; letter-spacing:0; font-size:0.75rem;"></p>
        </div>

        <div id="profile-notice" class="notice hidden" style="margin-bottom:0.75rem;"></div>
        <button id="btn-save-profile" class="btn btn--primary" onclick="saveDisplayName()"></button>
      </div>

      <!-- ─── Subscription ──────────────────────────────────────────────── -->
      <div class="settings-section">
        <p id="label-subscription" class="label" style="margin-bottom:1.25rem;"></p>
        <div id="subscription-block" class="subscription-block">
          <p id="txt-subscription-loading"></p>
        </div>
      </div>

      <!-- ─── Delete Account ────────────────────────────────────────────── -->
      <div class="danger-zone">
        <p id="label-delete-account" class="label" style="margin-bottom:0.75rem;"></p>
        <p id="txt-delete-warning" style="font-size:0.875rem; color:var(--muted); margin-bottom:0.5rem; line-height:1.6;"></p>
        <p id="txt-deactivate-hint" style="font-size:0.8rem; color:var(--muted); margin-bottom:1.25rem; line-height:1.5;"></p>

        <div id="delete-step-1">
          <button id="btn-delete-account" class="btn btn--danger" onclick="startDeleteFlow()"></button>
        </div>

        <div id="delete-step-2" class="hidden">
          <div style="border:1px solid var(--accent); padding:1.25rem; background:var(--light-accent); margin-bottom:1rem;">
            <p id="txt-are-you-sure" style="font-size:0.875rem; color:var(--accent); font-weight:500; margin-bottom:0.5rem;"></p>
            <p id="txt-delete-details" style="font-size:0.85rem; color:var(--muted); margin-bottom:1rem; line-height:1.5;"></p>
            <div class="form-group" style="margin-bottom:0.75rem;">
              <label class="label" for="delete-confirm-input"><span id="label-type-delete"></span></label>
              <input type="text" id="delete-confirm-input" class="input-field" placeholder="DELETE" style="max-width:200px;" oninput="checkDeleteConfirm()">
            </div>
            <div style="display:flex; gap:0.75rem;">
              <button id="btn-confirm-delete" class="btn btn--danger" onclick="confirmDelete()" disabled></button>
              <button id="btn-cancel-delete" class="btn btn--ghost" onclick="cancelDeleteFlow()"></button>
            </div>
          </div>
        </div>

        <div id="delete-notice" class="notice hidden" style="margin-top:0.75rem;"></div>
      </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/settings.js"></script>
  <script>
    function renderTranslations() {
      document.title = t('settings.pageTitle') + ' \u2014 AudioProctor';
      document.getElementById('heading-settings').textContent = t('settings.pageTitle');
      document.getElementById('lnk-dashboard').textContent = t('nav.dashboard');
      document.getElementById('btn-signout').textContent = t('admin.signOut');
      document.getElementById('label-profile').textContent = t('settings.profile');
      document.getElementById('label-display-name').textContent = t('settings.displayName') + ' ';
      document.getElementById('span-display-name-optional').textContent = t('settings.displayNameOptional');
      document.getElementById('display-name-input').placeholder = t('settings.displayNamePlaceholder');
      document.getElementById('label-email').textContent = t('settings.emailAddress');
      document.getElementById('txt-email-sourced').textContent = t('settings.emailSourced');
      document.getElementById('label-org').textContent = t('settings.organization');
      document.getElementById('txt-org-admin').textContent = t('settings.orgSetByAdmin');
      document.getElementById('btn-save-profile').textContent = t('settings.saveProfile');
      document.getElementById('label-subscription').textContent = t('settings.subscription');
      document.getElementById('txt-subscription-loading').textContent = t('settings.loadingDetails');
      document.getElementById('label-delete-account').textContent = t('settings.deleteAccount');
      document.getElementById('txt-delete-warning').innerHTML = t('settings.deleteWarning');
      document.getElementById('txt-deactivate-hint').innerHTML =
        '<strong>' + t('settings.leaveSchool') + '</strong> ' + t('settings.deactivateHint');
      document.getElementById('btn-delete-account').textContent = t('settings.deleteMyAccount');
      document.getElementById('txt-are-you-sure').textContent = t('settings.areYouSure');
      document.getElementById('txt-delete-details').textContent = t('settings.deleteDetails');
      document.getElementById('label-type-delete').textContent = t('settings.typeDeleteToConfirm');
      document.getElementById('btn-confirm-delete').textContent = t('settings.permanentlyDelete');
      document.getElementById('btn-cancel-delete').textContent = t('common.cancel');
    }

    async function init() {
      const user = await requireAuth();
      if (!user) return;
      document.getElementById('user-email').textContent = user.email;
      await initSettings(user);
    }

    window.i18nReady.then(function() {
      renderTranslations();
      init();
    });

    window.addEventListener('localechanged', renderTranslations);

    function handleSignOut() {
      supabaseClient.auth.signOut();
      window.location.href = '/login.html';
    }
  </script>

</body>
</html>
