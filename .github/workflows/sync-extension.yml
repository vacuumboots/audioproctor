name: Sync extension to public repo

on:
  push:
    branches:
      - main
    paths:
      - 'extension/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push extension subtree to public repo
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${PUBLIC_REPO_TOKEN:-}" ]; then
            echo "PUBLIC_REPO_TOKEN is empty or unavailable. Check repo secrets." >&2
            exit 1
          fi

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git remote add public https://vacuumboots:${PUBLIC_REPO_TOKEN}@github.com/vacuumboots/audioproctor-extension.git

          # Quick auth check with the PAT before attempting push
          git ls-remote public >/dev/null

          git subtree push --prefix=extension public main
