<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accept Invitation — AudioProctor</title>
  <script type="module" src="/js/i18n.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <a href="/" class="wordmark">Audio<span class="accent">Proctor</span></a>

      <div id="state-loading">
        <p id="txt-loading" style="color:var(--muted); font-size:0.9rem; margin-top:1.5rem;"></p>
      </div>

      <div id="state-invite" style="display:none;">
        <p class="tagline" id="invite-desc" style="margin-top:1rem;"></p>
        <div id="notice-invite" class="notice notice--error hidden" style="margin-top:1rem;"></div>
        <button id="btn-accept" class="btn btn--primary" style="margin-top:1.5rem; width:100%;" onclick="acceptInvite()"></button>
        <p id="txt-must-sign-in" style="font-size:0.8rem; color:var(--muted); margin-top:1rem; line-height:1.5;"></p>
      </div>

      <div id="state-accepting" style="display:none;">
        <p id="txt-accepting" style="color:var(--muted); font-size:0.9rem; margin-top:1.5rem;"></p>
      </div>

      <div id="state-expired" style="display:none;">
        <div class="notice notice--error" style="margin-top:1.5rem;">
          <span id="txt-invitation-expired"></span>
        </div>
        <p id="txt-request-new" style="margin-top:1rem; color:var(--muted); font-size:0.9rem; line-height:1.5;"></p>
        <a id="lnk-request-access" href="/site/request-access.html" class="btn btn--primary" style="margin-top:1rem; display:block; text-align:center;"></a>
      </div>

      <div id="state-error" style="display:none;">
        <div id="error-msg" class="notice notice--error" style="margin-top:1.5rem;"></div>
        <a id="lnk-sign-in" href="/login.html" class="btn btn--ghost" style="margin-top:1rem; display:block; text-align:center;"></a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script>
    const PENDING_INVITE_KEY = 'ap_pending_invite_token';
    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }

    function renderTranslations() {
      document.title = t('auth.acceptInvitation') + ' \u2014 AudioProctor';
      document.getElementById('txt-loading').textContent = t('auth.validatingInvitation');
      document.getElementById('btn-accept').textContent = t('auth.signInWithGoogleToAccept');
      document.getElementById('txt-accepting').textContent = t('auth.acceptingInvitation');
      document.getElementById('txt-invitation-expired').textContent = t('auth.invitationExpired');
      document.getElementById('txt-request-new').textContent = t('auth.requestNewInvitation');
      document.getElementById('lnk-request-access').textContent = t('auth.requestAccess');
      document.getElementById('lnk-sign-in').textContent = t('auth.signIn');
    }

    function showState(id) {
      ['state-loading','state-invite','state-accepting','state-expired','state-error'].forEach(s => {
        document.getElementById(s).style.display = s === id ? '' : 'none';
      });
    }

    function showError(msg) {
      document.getElementById('error-msg').textContent = msg;
      showState('state-error');
    }

    async function loadInvite() {
      if (!token) { showError(t('auth.noInvitationToken')); return; }

      try {
        const res  = await fetch(`/api/accept-invite?token=${encodeURIComponent(token)}`);
        const data = await res.json();

        if (!res.ok) {
          if (res.status === 410 && data.reason === 'expired') {
            showState('state-expired');
            return;
          }
          showError(data.error || t('auth.invitationInvalid'));
          return;
        }

        // Show invitation details
        var desc;
        if (data.divisionName) {
          desc = t('auth.youHaveBeenInvitedToJoinWithEntity', { org: 'AudioProctor', entity: data.divisionName });
        } else if (data.schoolName) {
          desc = t('auth.youHaveBeenInvitedToJoinWithEntity', { org: 'AudioProctor', entity: data.schoolName });
        } else {
          desc = t('auth.youHaveBeenInvitedToJoin', { org: 'AudioProctor' });
        }

        document.getElementById('invite-desc').textContent  = desc;
        document.getElementById('txt-must-sign-in').innerHTML =
          t('auth.mustSignInWithAccountFor', { email: '<strong>' + escapeHtml(data.email) + '</strong>' });
        showState('state-invite');

        // If already signed in with the right account, auto-accept
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session && session.user.email.toLowerCase() === data.email.toLowerCase()) {
          await doAccept(session.access_token);
        }
      } catch {
        showError(t('auth.couldNotLoadInvitation', { email: 'hello@audioproctor.com' }));
      }
    }

    async function acceptInvite() {
      // Store token so login.html can redirect back here after OAuth
      localStorage.setItem(PENDING_INVITE_KEY, token);

      document.getElementById('btn-accept').disabled = true;
      document.getElementById('btn-accept').textContent = t('auth.redirecting');
      document.getElementById('notice-invite').classList.add('hidden');

      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: 'https://app.audioproctor.com/login.html' },
      });

      if (error) {
        document.getElementById('btn-accept').disabled = false;
        document.getElementById('btn-accept').textContent = t('auth.signInWithGoogleToAccept');
        document.getElementById('notice-invite').textContent = t('auth.couldNotStartSignIn');
        document.getElementById('notice-invite').classList.remove('hidden');
      }
    }

    async function doAccept(jwt) {
      showState('state-accepting');
      try {
        const res  = await fetch('/api/accept-invite', {
          method:  'POST',
          headers: {
            'Content-Type':  'application/json',
            'Authorization': `Bearer ${jwt}`,
          },
          body: JSON.stringify({ token }),
        });
        const data = await res.json();

        if (!res.ok) { showError(data.error || t('auth.couldNotAcceptInvitation')); return; }

        localStorage.removeItem(PENDING_INVITE_KEY);

        // Redirect to the right dashboard based on role
        const dest = {
          platform_admin: '/admin.html',
          division_admin: '/division-admin.html',
          school_admin:   '/school-admin.html',
        }[data.role] || '/dashboard.html';

        window.location.href = dest;
      } catch {
        showError(t('auth.inviteNetworkError', { email: 'hello@audioproctor.com' }));
      }
    }

    window.i18nReady.then(function() {
      renderTranslations();
      loadInvite();
    });

    window.addEventListener('localechanged', renderTranslations);
  </script>
</body>
</html>
