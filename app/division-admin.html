<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AudioProctor — Division Admin</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-box {
      border: var(--border);
      padding: 1.25rem 1.5rem;
    }
    .stat-box__value {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 0.25rem;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
    }
    .admin-table th {
      text-align: left;
      padding: 0.5rem 0.75rem;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
      border-bottom: var(--border);
      white-space: nowrap;
    }
    .admin-table td {
      padding: 0.75rem 0.75rem;
      border-bottom: 1px solid var(--warm-mid);
      vertical-align: middle;
      font-size: 0.875rem;
    }
    .admin-table tr:last-child td { border-bottom: none; }
    .admin-table tr:hover td { background: var(--warm-mid); }
    .chart-container {
      margin-top: 0.5rem;
      overflow-x: auto;
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .drill-down-panel {
      border-top: var(--border);
      padding-top: 1.5rem;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="page-container">
      <div class="top-bar__inner">
        <span class="wordmark">Audio<span class="accent">Proctor</span> <span style="font-size:0.8rem; font-family:'DM Sans',sans-serif; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin-left:0.5rem;">Division Admin</span></span>
        <div style="display:flex; align-items:center; gap:1.5rem;">
          <span id="admin-email" class="label"></span>
          <a href="/dashboard.html" class="btn btn--ghost btn--small">My Dashboard</a>
          <a href="/settings.html" class="btn btn--ghost btn--small">Settings</a>
          <button class="btn btn--ghost btn--small" onclick="handleSignOut()">Sign out</button>
        </div>
      </div>
    </div>
  </div>

  <div class="page-container" style="padding-top:2.5rem; padding-bottom:4rem;">

    <h1 style="font-size:1.6rem; line-height:1.2; margin-bottom:1.5rem;" id="division-name-title">—</h1>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-box">
        <div id="stat-schools" class="stat-box__value">—</div>
        <div class="label">Schools</div>
      </div>
      <div class="stat-box">
        <div id="stat-teachers" class="stat-box__value">—</div>
        <div class="label">Teachers</div>
      </div>
      <div class="stat-box">
        <div id="stat-active" class="stat-box__value">—</div>
        <div class="label">Active This Year</div>
      </div>
      <div class="stat-box">
        <div id="stat-sessions" class="stat-box__value">—</div>
        <div class="label">Total Sessions</div>
      </div>
    </div>

    <!-- Assessment window chart -->
    <div class="card" style="margin-bottom:1.5rem;">
      <div class="card__header">
        <p class="label">Assessment Activity</p>
      </div>
      <div id="activity-chart">
        <div class="empty-state"><p class="label">Loading…</p></div>
      </div>
    </div>

    <!-- Schools -->
    <div class="card">
      <div class="card__header" style="display:flex; align-items:center; justify-content:space-between;">
        <p class="label">Schools</p>
        <button class="btn btn--ghost btn--small" onclick="exportDivisionCsv()">Export CSV</button>
      </div>

      <div id="schools-container">
        <div class="empty-state"><p class="label">Loading…</p></div>
      </div>

      <!-- School drill-down panel (shown on click) -->
      <div id="drill-down-panel" class="drill-down-panel hidden">
        <div style="display:flex; align-items:center; gap:1rem; margin-bottom:1.25rem;">
          <button class="btn btn--ghost btn--small" onclick="closeDrillDown()">← Back to Schools</button>
          <h2 id="drill-down-title" style="font-size:1.1rem; margin:0;"></h2>
        </div>
        <div id="drill-down-container">
          <div class="empty-state"><p class="label">Loading…</p></div>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/division-admin.js"></script>
  <script>
    (async () => {
      const user = await requireAuth();
      if (!user) return;
      document.getElementById('admin-email').textContent = user.email;
      await initDivisionAdmin(user);
    })();
  </script>

</body>
</html>
