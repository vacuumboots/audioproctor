<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AudioProctor — Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .upload-progress {
      margin-top: 1rem;
      display: none;
    }
    .upload-progress__bar {
      width: 100%;
      height: 4px;
      background: var(--warm-mid);
      margin-bottom: 0.4rem;
    }
    .upload-progress__fill {
      height: 100%;
      background: var(--ink);
      width: 0%;
      transition: width 0.2s ease;
    }
    .upload-progress__label {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .col-assessment { min-width: 180px; }
    .col-assessment__label { font-weight: 500; }
    .col-assessment__filename { font-size: 0.78rem; color: var(--muted); margin-top: 0.1rem; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="page-container">
      <div class="top-bar__inner">
        <span class="wordmark">Audio<span class="accent">Proctor</span></span>
        <div style="display:flex; align-items:center; gap:1.5rem;">
          <span id="user-email" class="label"></span>
          <button class="btn btn--ghost btn--small" onclick="handleSignOut()">Sign out</button>
        </div>
      </div>
    </div>
  </div>

  <div class="page-container" style="padding-top:2.5rem; padding-bottom:4rem;">

    <!-- Upload Card -->
    <div class="card">
      <div class="card__header">
        <p class="label">New Assessment</p>
      </div>

      <div id="upload-notice" class="notice hidden"></div>

      <div class="form-group">
        <label class="label" for="label-input">Assessment Label <span style="font-weight:300; text-transform:none; letter-spacing:0;">(optional)</span></label>
        <input
          type="text"
          id="label-input"
          class="input-field"
          placeholder="e.g. Grade 4 Reading — May 2026"
          maxlength="120"
        >
      </div>

      <div class="form-group">
        <label class="label" for="file-input">MP3 Audio File</label>
        <input
          type="file"
          id="file-input"
          class="input-field"
          accept=".mp3,audio/mpeg"
          onchange="handleFileSelect(this)"
        >
        <span id="file-hint" class="label text-muted">Max 100 MB · MP3 only</span>
      </div>

      <div class="upload-progress" id="upload-progress">
        <div class="upload-progress__bar">
          <div class="upload-progress__fill" id="progress-fill"></div>
        </div>
        <span class="upload-progress__label" id="progress-label">Uploading…</span>
      </div>

      <button
        id="btn-upload"
        class="btn btn--primary"
        onclick="handleUpload()"
        disabled
      >
        Upload Assessment
      </button>
    </div>

    <!-- Uploads List -->
    <div class="card mt-4">
      <div class="card__header">
        <p class="label">Your Uploads</p>
      </div>

      <div id="uploads-container">
        <div class="empty-state">
          <p class="label">No assessments uploaded yet</p>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/dashboard.js"></script>
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script>window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };</script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
  <script>
    (async () => {
      const user = await requireAuth();
      document.getElementById('user-email').textContent = user.email;
      await loadUploads();
    })();
  </script>

</body>
</html>
