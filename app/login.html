<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AudioProctor — Sign In / Connexion</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <a href="/" class="wordmark">Audio<span class="accent">Proctor</span></a>
      <p class="tagline">
        Assessment audio for managed Chromebooks<br>
        Évaluation audio pour Chromebooks gérés
      </p>

      <div id="notice" class="notice notice--error hidden"></div>

      <button id="btn-signin" class="btn btn--primary" onclick="signInWithGoogle()">
        Sign in with Google<br>
        <small style="font-weight:300;">Connectez-vous avec Google</small>
      </button>

      <p class="login-footer">
        For teachers only. Students use the Chrome extension.<br>
        Pour les enseignants seulement. Les élèves utilisent l'extension Chrome.
      </p>
      <p class="login-footer" style="margin-top:0.5rem;">
        New here? <a href="/request-access" style="color:var(--ink);">Request Access</a>
        &nbsp;|&nbsp;
        Nouveau? <a href="/request-access" style="color:var(--ink);">Demander l'accès</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script>
    // ─── Google Sign-In ──────────────────────────────────────────
    async function signInWithGoogle() {
      var btn = document.getElementById('btn-signin');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = 'Redirecting…<br><small style="font-weight:300;">Redirection…</small>';
      }

      var result = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin + '/login.html',
        },
      });

      if (result.error) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = 'Sign in with Google<br><small style="font-weight:300;">Connectez-vous avec Google</small>';
        }
        var notice = document.getElementById('notice');
        if (notice) {
          notice.textContent = 'Could not start sign-in. Please try again. / Impossible de démarrer la connexion. Veuillez réessayer.';
          notice.classList.remove('hidden');
        }
      }
    }

    // ─── Role-based redirect after OAuth ─────────────────────────
    async function redirectByRole(session) {
      var pendingToken = localStorage.getItem('ap_pending_invite_token');
      if (pendingToken) {
        window.location.href = '/accept-invite.html?token=' + encodeURIComponent(pendingToken);
        return;
      }

      var result = await supabaseClient
        .from('profiles').select('role').eq('id', session.user.id).maybeSingle();
      var dest = {
        platform_admin: '/admin.html',
        division_admin: '/division-admin.html',
        school_admin:   '/school-admin.html',
      }[result.data && result.data.role] || '/dashboard.html';
      window.location.href = dest;
    }

    // ─── Auth state listener ─────────────────────────────────────
    // onAuthStateChange fires synchronously when Supabase detects
    // an OAuth callback token in the URL hash.
    supabaseClient.auth.onAuthStateChange(async function (event, session) {
      if (event === 'SIGNED_IN' && session) {
        history.replaceState(null, '', window.location.pathname);
        await redirectByRole(session);
      }
    });

    // Show error from URL param (e.g. OAuth provider returns error)
    var params = new URLSearchParams(window.location.search);
    if (params.get('error')) {
      var el = document.getElementById('notice');
      el.textContent = 'Could not start sign-in. Please try again. / Impossible de démarrer la connexion. Veuillez réessayer.';
      el.classList.remove('hidden');
    }
  </script>
</body>
</html>
